name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodejs
            working-directory: apps/nodejs
            language: node
          - name: flask
            working-directory: apps/flask
            language: python
          - name: java
            working-directory: apps/java
            language: java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: apps/nodejs/package-lock.json

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/flask/requirements.txt

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Node.js dependencies
        if: matrix.language == 'node'
        working-directory: apps/nodejs
        run: npm install

      - name: Run Node.js tests
        if: matrix.language == 'node'
        working-directory: apps/nodejs
        run: npm test

      - name: Upload Node.js coverage
        if: matrix.language == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nodejs
          path: apps/nodejs/coverage/lcov.info
          retention-days: 7

      - name: Install Python dependencies
        if: matrix.language == 'python'
        working-directory: apps/flask
        run: pip install -r requirements.txt

      - name: Run Python tests
        if: matrix.language == 'python'
        working-directory: apps/flask
        run: pytest --cov=app --cov-fail-under=70 -v

      - name: Upload Python coverage
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-flask
          path: apps/flask/.coverage
          retention-days: 7

      - name: Run Java tests
        if: matrix.language == 'java'
        working-directory: apps/java
        run: mvn -B verify

      - name: Upload Java coverage
        if: matrix.language == 'java'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-java
          path: apps/java/target/site/jacoco/jacoco.xml
          retention-days: 7
