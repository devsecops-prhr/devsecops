name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build e push das imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nodejs
            context: apps/nodejs
          - app: flask
            context: apps/flask
          - app: java
            context: apps/java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag da imagem
        id: meta
        run: |
          echo "owner=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devsecops-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/devsecops-${{ matrix.app }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-dev:
    name: Deploy no ambiente dev
    needs: build-and-push
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar contexto do cluster
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          context-name: ${{ secrets.K8S_CONTEXT }}

      - name: Aplicar manifests no namespace dev
        run: |
          kubectl kustomize k8s/overlays/dev | kubectl apply -f -
          kubectl rollout status deployment -n dev --timeout=120s

  deploy-staging:
    name: Deploy no ambiente staging
    needs: deploy-dev
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar contexto do cluster
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          context-name: ${{ secrets.K8S_CONTEXT }}

      - name: Aplicar manifests no namespace staging
        run: |
          kubectl kustomize k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment -n staging --timeout=120s

  deploy-prod:
    name: Deploy no ambiente produção
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar contexto do cluster
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
          context-name: ${{ secrets.K8S_CONTEXT }}

      - name: Aplicar manifests no namespace prod
        run: |
          kubectl kustomize k8s/overlays/prod | kubectl apply -f -
          kubectl rollout status deployment -n prod --timeout=120s
